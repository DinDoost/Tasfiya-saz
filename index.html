<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>محاسبه اشتراک مصارف</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
:root{
  --blue:#1769e0; --pink:#ed1670; --green:#20a94b; --orange:#ff8a00;
  --purple:#7040c7; --red:#e22b25; --ink:#111827; --cream:#fffdf6;
}
body{
  margin:0; font-family:Tahoma,"Vazirmatn","Noto Naskh Arabic",sans-serif;
  background:linear-gradient(135deg,#eef6ff,#fff4fb 45%,#f4fff4);
  color:var(--ink); padding:12px; font-weight:800;
  overscroll-behavior-y: contain;
}
button,input,select{font:inherit; font-weight:900;}

.app{max-width:940px;margin:auto}
.top{
  background:linear-gradient(135deg,#fff,#fff9ef);
  border:3px solid #1c9b66;border-radius:26px;padding:16px 14px 14px;
  box-shadow:0 8px 28px #00000018; margin-bottom:12px; position:relative; overflow:hidden;
}
.top:before,.top:after{content:"📊";position:absolute;font-size:45px;opacity:.75;top:8px}
.top:before{left:10px}.top:after{right:10px}

h1{text-align:center;color:#d92323;font-size:34px;margin:5px 0 5px;text-shadow:2px 2px #ffd8d8;font-weight:1000; position:relative; z-index:5;}

.expense-modal{position:fixed;inset:0;z-index:100001;display:flex;align-items:center;justify-content:center;background:#00000066;backdrop-filter:blur(4px);opacity:0;visibility:hidden;pointer-events:none;transition:.2s;}
.expense-modal.show{opacity:1;visibility:visible;pointer-events:auto;}
.expense-dialog{width:min(92vw,420px);background:#fff;border:3px solid #1c9b66;border-radius:22px;padding:18px;box-shadow:0 12px 35px #0004;}
.expense-dialog h3{margin:0 0 12px;text-align:center;color:#1769e0;font-size:22px;}
.expense-dialog input{font-size:22px;text-align:center;direction:ltr;}
.expense-modal-actions{display:flex;gap:10px;margin-top:12px;}
.expense-modal-actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:1000;font-size:16px;cursor:pointer;}
.expense-confirm{background:#20a94b;color:#fff;}
.expense-cancel{background:#f2f5fa;color:#111827;}

.panel{ background:#ffffffec;border:2px solid #d8e5ff;border-radius:20px; padding:16px;box-shadow:0 6px 20px #00000012;margin-bottom:12px }
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .wide{grid-column:1/-1}
label{font-size:14px;font-weight:1000;color:#1f2937;margin:0 0 6px;display:block}
input,select{ width:100%;border:2px solid #dbe5f4;border-radius:12px;padding:12px 10px; background:#fff;outline:none;color:#111827; font-size:16px; font-weight:900; }
input:focus,select:focus{border-color:#4d8df7;box-shadow:0 0 0 3px #4d8df71b}

.date-input-group { position: relative; }
.date-display-btn {
  width: 100%; background: #fff; border: 2px solid #dbe5f4; border-radius: 12px;
  padding: 12px 10px; font-size: 16px; font-weight: 900; color: #111827; text-align: right;
  cursor: pointer; display: flex; justify-content: space-between; align-items: center;
}
.date-display-btn:active { background: #f0f4ff; }

.btn{ border:0;border-radius:13px;padding:12px 14px;font-weight:1000;font-size:16px;cursor:pointer; box-shadow:0 4px 10px #00000018; transition:.12s transform,.12s filter }
.btn:active{transform:scale(.95)}
.add{background:linear-gradient(135deg,#18a34a,#07883b);color:white;width:100%;margin-top:12px; font-size:18px;}
.image{background:linear-gradient(135deg,#1769e0,#0b4fb7);color:white;flex:1; font-size:18px;}
.clear{background:#f2f5fa;color:#111827; border:2px solid #dbe5f4;}
.actions{display:flex;gap:10px;margin-top:14px;position:relative;z-index:10;}
.count{font-weight:1000;color:#1a5dc6;font-size:16px; margin-bottom:10px;}

.table-wrap{overflow-x:auto;border-radius:15px;border:1px solid #d8e1ee}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:780px;background:white}
th,td{padding:12px 6px;text-align:center;border-left:1px solid #fff;border-bottom:1px solid #fff;font-weight:900; font-size:13px; color:#111827;}
th{color:#fff; font-size:13px; font-weight:1000;}
th:nth-child(1){background:var(--purple)} 
th:nth-child(2){background:var(--pink)}
th:nth-child(3){background:var(--blue)}
th:nth-child(4){background:var(--orange)}
th:nth-child(5){background:#d63384} /* هدر ماه */
th:nth-child(6){background:#198754}  /* هدر روز */
th:nth-child(7){background:#0b4fb7} 
th:nth-child(8){background:#e22b25}
td{background:#f8fbff}
tr:nth-child(even) td{background:#fff3fa}

.num{font-weight:1000; font-size:15px; color:var(--purple); direction:ltr; text-align:center;}
.money{direction:ltr;unicode-bidi:plaintext; font-weight:1000; font-size:14px; color:#0b4fb7; text-align:center;}

/* استایل دایره‌های بزرگتر با رنگ پر شده */
.month-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 65px;
  height: 42px;
  padding: 0 10px;
  background: #fce8f3;
  border: 2px solid #d63384;
  border-radius: 21px;
  color: #b02a6b;
  font-weight: 1000;
  font-size: 14px;
}

.day-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 65px;
  height: 42px;
  padding: 0 10px;
  background: #e8f8f0;
  border: 2px solid #198754;
  border-radius: 21px;
  color: #146c43;
  font-weight: 1000;
  font-size: 14px;
}

.edit{background:#1769e0;color:white;padding:6px 8px;border-radius:8px;border:0; cursor:pointer; font-weight:1000; font-size:12px;}
.del{background:#ef3340;color:white;padding:6px 8px;border-radius:8px;border:0;margin-right:2px; cursor:pointer; font-weight:1000; font-size:12px;}

.total-sum-box{
  margin-top:16px;border:4px solid #e52c20;border-radius:20px;
  background:linear-gradient(135deg,#fff36b,#ffc928);
  padding:16px;text-align:center;box-shadow:0 6px 20px #0002; cursor:pointer;
}
.total-sum-box small{display:block;color:#8e1710;font-weight:1000;font-size:16px}
.total-sum-box strong{display:block;color:#a40000;font-size:26px; font-weight:1000; margin-top:4px; direction:ltr; unicode-bidi:plaintext;}
.empty{text-align:center;padding:25px;color:#4b5563;font-weight:900; font-size:16px;}

.notes-box{margin-top:12px}
textarea{width:100%;border:2px solid #dbe5f4;border-radius:12px;padding:10px;background:#fff;outline:none;color:#111827;resize:vertical;font-family:inherit;font-size:16px; font-weight:900;}
textarea:focus{border-color:#4d8df7;box-shadow:0 0 0 3px #4d8df71b}

.invoice-card{ position:fixed;left:-10000px;top:0;width:1050px;background:#fff; }
#capture{ width:1050px;padding:26px;background:linear-gradient(135deg,#fffdf6,#f7fbff); border:6px solid #16885b;border-radius:30px;overflow:hidden; }
.capture-title{font-size:42px;text-align:center;color:#d92323;font-weight:1000;margin:3px 0 15px}
.capture-table{width:100%;margin:0 auto;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.capture-table th{font-size:16px;padding:10px 4px;font-weight:1000}
.capture-table td{font-size:18px;padding:10px 4px;font-weight:1000; color:#111827;}
.capture-total{margin-top:20px;border:5px solid #e32b22;border-radius:22px;background:#ffd12b;text-align:center;padding:16px;font-size:28px;font-weight:1000;color:#9d0808;direction:ltr;unicode-bidi:plaintext;}
.capture-footer{margin-top:18px;border:4px solid #16885b;border-radius:20px;overflow:hidden;background:#fff;direction:rtl; padding:16px; font-size:20px; line-height:1.6; font-weight:1000;}

.persian-calendar{position:fixed;z-index:100000;display:none;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,340px);background:#fff;border:3px solid #1c9b66;border-radius:22px;padding:18px;box-shadow:0 12px 35px #0004;direction:rtl}
.persian-calendar.show{display:block}
.pc-title{font-size:20px;font-weight:1000;color:#1769e0;text-align:center;margin-bottom:14px}
.pc-form-group{margin-bottom:10px}
.pc-form-group label{font-size:13px;color:#374151;margin-bottom:4px}
.pc-form-group input{text-align:center;direction:ltr;font-size:18px;font-weight:1000;}
.pc-actions{display:flex;gap:8px;margin-top:14px}
.pc-actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:1000;font-size:16px;cursor:pointer}
.pc-confirm{background:#20a94b;color:#fff;}
.pc-cancel{background:#f2f5fa;color:#111827;}

.save-success{
  position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#00000066; backdrop-filter:blur(4px);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease;
}
.save-success.show{opacity:1;visibility:visible;pointer-events:auto;}
.save-success-check{
  width:110px;height:110px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:#20a94b;color:#fff;border:6px solid #fff;
  box-shadow:0 10px 30px #0006;font-size:75px;font-weight:1000;line-height:1;
}
.save-success-text{
  margin-top:18px;padding:10px 20px;border-radius:14px;background:#fff;color:#16885b;
  font-size:20px;font-weight:1000;box-shadow:0 6px 20px #0004;
}

@media(max-width:620px){
  body{padding:8px} h1{font-size:26px}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <h1>محاسبه اشتراک مصارف</h1>
  </div>

  <div class="panel">
    <div class="form-grid">
      <div class="wide">
        <label>نام شخص</label>
        <input id="personName" placeholder="مثلاً احمد جان">
      </div>
      <div>
        <label>تاریخ شروع حضور</label>
        <div class="date-input-group">
          <button type="button" class="date-display-btn" id="startDateBtn" onclick="openCalendar('start')">
            <span id="startDateText">انتخاب تاریخ</span> 📅
          </button>
        </div>
      </div>
      <div>
        <label>تاریخ ختم حضور</label>
        <div class="date-input-group">
          <button type="button" class="date-display-btn" id="endDateBtn" onclick="openCalendar('end')">
            <span id="endDateText">انتخاب تاریخ</span> 📅
          </button>
        </div>
      </div>
    </div>
    <button class="btn add" id="addPersonBtn" type="button" onclick="addOrUpdatePerson()">＋ افزودن شخص به لیست</button>
  </div>

  <div class="panel">
    <div class="count" id="personCount">0 نفر در لیست</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>شماره</th>
            <th>نام شخص</th>
            <th>تاریخ شروع</th>
            <th>تاریخ ختم</th>
            <th>تعداد ماه</th>
            <th>تعداد روز</th>
            <th>سهم هر روز (تومان)</th>
            <th>جمع سهم شخص (تومان)</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody id="personsRows"></tbody>
      </table>
      <div class="empty" id="emptyMsg">هنوز شخصی اضافه نشده است.</div>
    </div>

    <div class="total-sum-box" role="button" tabindex="0" onclick="openExpenseModal()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openExpenseModal();}">
      <small>مجموع کل مصارف (برای تغییر مبلغ کل اینجا کلیک کنید)</small>
      <strong id="totalSummaryText">0 تومان</strong>
    </div>

    <div class="notes-box">
      <label for="notesInput">توضیحات فاکتور</label>
      <textarea id="notesInput" rows="3" placeholder="مثلاً: هزینه مصارف مشترک اتاق..." oninput="handleNotesInput()"></textarea>
    </div>

    <div class="actions">
      <button class="btn image" type="button" onclick="exportImage()">▣ ذخیره عکس فاکتور</button>
      <button class="btn clear" type="button" onclick="clearAllData()">پاک‌کردن همه</button>
    </div>
  </div>
</div>

<div class="invoice-card"><div id="capture"></div></div>

<div id="persianCalendar" class="persian-calendar" aria-hidden="true">
  <div class="pc-title" id="pcTitleModal">انتخاب تاریخ</div>
  <div class="pc-form-group">
    <label>سال (مثلاً 1405)</label>
    <input id="pcYearInput" type="text" inputmode="numeric" placeholder="1405">
  </div>
  <div class="pc-form-group">
    <label>ماه (عدد 1 تا 12)</label>
    <input id="pcMonthInput" type="text" inputmode="numeric" placeholder="1">
  </div>
  <div class="pc-form-group">
    <label>روز (عدد 1 تا 31)</label>
    <input id="pcDayInput" type="text" inputmode="numeric" placeholder="1">
  </div>
  <div class="pc-actions">
    <button type="button" class="pc-confirm" onclick="confirmCalendarDate()">تأیید تاریخ</button>
    <button type="button" class="pc-cancel" onclick="closeCalendar()">انصراف</button>
  </div>
</div>

<div id="expenseModal" class="expense-modal" aria-hidden="true" onclick="if(event.target===this)closeExpenseModal()">
  <div class="expense-dialog" role="dialog" aria-modal="true" aria-labelledby="expenseModalTitle">
    <h3 id="expenseModalTitle">ثبت مبلغ کل مصارف</h3>
    <input id="expenseModalInput" type="text" inputmode="numeric" placeholder="مثلاً 120000000">
    <div class="expense-modal-actions">
      <button type="button" class="expense-confirm" onclick="confirmExpense()">تأیید</button>
      <button type="button" class="expense-cancel" onclick="closeExpenseModal()">انصراف</button>
    </div>
  </div>
</div>

<div id="saveSuccess" class="save-success" aria-hidden="true">
  <div class="save-success-check">✓</div>
  <div class="save-success-text" id="saveSuccessText">عکس فاکتور با موفقیت ذخیره شد</div>
</div>

<script>
const $ = id => document.getElementById(id);
let persons = [];
let editIndex = -1;
let activeDateField = null;

let startDateObj = null;
let endDateObj = null;

function fmt(n){ return Number(Math.round(Number(n)||0)).toLocaleString('en-US'); }
const parseMoney = v => Math.max(0, Number(String(v||'').replace(/[^0-9.]/g,'')) || 0);

function getTotalExpense(){ return parseMoney(localStorage.getItem('foodCalcExpense') || '0'); }

function openExpenseModal(){
  const amount = getTotalExpense();
  $('expenseModalInput').value = amount ? amount.toLocaleString('en-US') : '';
  $('expenseModal').classList.add('show');$('expenseModal').setAttribute('aria-hidden','false');
  setTimeout(() => $('expenseModalInput').focus(), 50);
}

function closeExpenseModal(){
  $('expenseModal').classList.remove('show');$('expenseModal').setAttribute('aria-hidden','true');
}

function confirmExpense(){
  const amount = parseMoney($('expenseModalInput').value);
  localStorage.setItem('foodCalcExpense', String(amount));
  closeExpenseModal();
  calculateCosts();
  saveData();
}

function jalaliToDays(y, m, d){
  let days = (y - 1400) * 365 + Math.floor((y - 1400) / 4);
  for(let i=1; i<m; i++){
    if(i<=6) days += 31;
    else if(i<=11) days += 30;
    else days += 29;
  }
  return days + d;
}

function calculateDaysBetween(sy, sm, sd, ey, em, ed){
  const startDays = jalaliToDays(sy, sm, sd);
  const endDays = jalaliToDays(ey, em, ed);
  const diff = endDays - startDays + 1;
  return diff > 0 ? diff : 0;
}

function calculateMonthsAndDays(sy, sm, sd, ey, em, ed){
  let totalDays = calculateDaysBetween(sy, sm, sd, ey, em, ed);
  if(totalDays <= 0) return { months: 0, days: 0, totalDays: 0 };

  let y1 = sy, m1 = sm, d1 = sd;
  let months = 0;

  while(true){
    let daysInCurrentMonth = 31;
    if(m1 > 6 && m1 <= 11) daysInCurrentMonth = 30;
    else if(m1 === 12) {
      let leap = ((y1 - 974) % 33 % 4 === 0);
      daysInCurrentMonth = leap ? 30 : 29;
    }

    if(y1 < ey || (y1 === ey && m1 < em) || (y1 === ey && m1 === em && d1 <= ed)){
      let nextY = m1 === 12 ? y1 + 1 : y1;
      let nextM = m1 === 12 ? 1 : m1 + 1;
      let nextD = d1;
      
      let nextDays = jalaliToDays(nextY, nextM, nextD);
      let endTotal = jalaliToDays(ey, em, ed) + 1;

      if(endTotal >= nextDays){
        months++;
        y1 = nextY;
        m1 = nextM;
        d1 = nextD;
      } else {
        break;
      }
    } else {
      break;
    }
  }

  let days = calculateDaysBetween(y1, m1, d1, ey, em, ed);
  if(days < 0) days = 0;

  return { months, days, totalDays };
}

function getDefaultJalaliDate(){
  const gDate = new Date();
  let gY = gDate.getFullYear();
  let gM = gDate.getMonth() + 1;
  let gD = gDate.getDate();
  
  let jY = gY - 621;
  let jM = 1;
  let jD = 1;
  if (gM < 3 || (gM === 3 && gD < 21)) {
    jY -= 1;
    jM = 10;
    jD = 10;
  } else {
    jM = 6;
    jD = 27;
  }
  return [jY, jM, jD];
}

function openCalendar(field){
  activeDateField = field;
  const targetDate = field === 'start' ? startDateObj : endDateObj;
  
  let dObj = targetDate;
  if(!dObj){
    dObj = getDefaultJalaliDate();
  }
  
  $('pcYearInput').value = dObj[0];$('pcMonthInput').value = dObj[1];
  $('pcDayInput').value = dObj[2];$('pcTitleModal').textContent = field === 'start' ? 'انتخاب تاریخ شروع' : 'انتخاب تاریخ ختم';
  $('persianCalendar').classList.add('show');
  setTimeout(() => $('pcDayInput').focus(), 50);
}

function closeCalendar(){
  $('persianCalendar').classList.remove('show');
}

function confirmCalendarDate(){
  const y = parseInt($('pcYearInput').value) || 1405;
  const m = parseInt($('pcMonthInput').value) || 1;
  const d = parseInt($('pcDayInput').value) || 1;
  
  if(m < 1 || m > 12){ alert('ماه باید بین ۱ تا ۱۲ باشد.'); return; }
  if(d < 1 || d > 31){ alert('روز باید بین ۱ تا ۳۱ باشد.'); return; }

  const formattedStr = `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`;

  if(activeDateField === 'start'){
    startDateObj = [y, m, d];
    $('startDateText').textContent = formattedStr;
  } else {
    endDateObj = [y, m, d];
    $('endDateText').textContent = formattedStr;
  }
  closeCalendar();
}

function addOrUpdatePerson(){
  const name = $('personName').value.trim();
  if(!name){ alert('لطفاً نام شخص را وارد کنید.'); $('personName').focus(); return; }
  if(!startDateObj){ alert('لطفاً تاریخ شروع حضور را انتخاب کنید.'); return; }
  if(!endDateObj){ alert('لطفاً تاریخ ختم حضور را انتخاب کنید.'); return; }

  const calc = calculateMonthsAndDays(startDateObj[0], startDateObj[1], startDateObj[2], endDateObj[0], endDateObj[1], endDateObj[2]);
  if(calc.totalDays <= 0){ alert('تاریخ ختم باید بعد یا مساوی تاریخ شروع باشد.'); return; }

  const personObj = {
    name,
    startDate: [...startDateObj],
    endDate: [...endDateObj],
    months: calc.months,
    days: calc.days,
    totalDays: calc.totalDays,
    share: 0,
    dailyRate: 0
  };

  if(editIndex >= 0){
    persons[editIndex] = personObj;
    editIndex = -1;
    $('addPersonBtn').textContent = '＋ افزودن شخص به لیست';
  } else {
    persons.push(personObj);
  }

  $('personName').value = '';
  startDateObj = null; endDateObj = null;
  $('startDateText').textContent = 'انتخاب تاریخ';
  $('endDateText').textContent = 'انتخاب تاریخ';

  calculateCosts();
  render();
  saveData();
}

function calculateCosts(){
  const totalExpense = getTotalExpense();
  const totalAllDays = persons.reduce((sum, p) => sum + p.totalDays, 0);

  if(totalAllDays > 0 && totalExpense > 0){
    const costPerDayTotal = totalExpense / totalAllDays;
    persons.forEach(p => {
      p.dailyRate = costPerDayTotal;
      p.share = p.totalDays * costPerDayTotal;
    });
  } else {
    persons.forEach(p => {
      p.share = 0;
      p.dailyRate = 0;
    });
  }
  render();
}

function render(){
  const tbody = $('personsRows');
  tbody.innerHTML = '';
  $('emptyMsg').style.display = persons.length ? 'none' : 'block';

  persons.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="num">${fmt(i+1)}</td>
      <td><b>${p.name}</b></td>
      <td class="num">${p.startDate[0]}/${String(p.startDate[1]).padStart(2,'0')}/${String(p.startDate[2]).padStart(2,'0')}</td>
      <td class="num">${p.endDate[0]}/${String(p.endDate[1]).padStart(2,'0')}/${String(p.endDate[2]).padStart(2,'0')}</td>
      <td><span class="month-badge">${fmt(p.months)} ماه</span></td>
      <td><span class="day-badge">${fmt(p.days)} روز</span></td>
      <td class="money">${fmt(p.dailyRate)}</td>
      <td class="money" style="color:#d92323;">${fmt(p.share)}</td>
      <td>
        <button class="edit" onclick="editPerson(${i})" type="button">ویرایش</button>
        <button class="del" onclick="deletePerson(${i})" type="button">حذف</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  $('personCount').textContent = fmt(persons.length) + ' نفر در لیست';
  const totalExpense = getTotalExpense();
  $('totalSummaryText').textContent = fmt(totalExpense) + ' تومان';
}

window.editPerson = function(i){
  const p = persons[i];
  $('personName').value = p.name;
  startDateObj = [...p.startDate];
  endDateObj = [...p.endDate];
  $('startDateText').textContent = `${startDateObj[0]}/${String(startDateObj[1]).padStart(2,'0')}/${String(startDateObj[2]).padStart(2,'0')}`;
  $('endDateText').textContent = `${endDateObj[0]}/${String(endDateObj[1]).padStart(2,'0')}/${String(endDateObj[2]).padStart(2,'0')}`;
  editIndex = i;
  $('addPersonBtn').textContent = '✓ ذخیره ویرایش شخص';
  window.scrollTo({top: 150, behavior: 'smooth'});
};

window.deletePerson = function(i){
  if(confirm('این شخص از لیست حذف شود؟')){
    persons.splice(i, 1);
    calculateCosts();
    render();
    saveData();
  }
};

function clearAllData(){
  if(confirm('تمام اطلاعات، افراد و هزینه‌ها پاک شوند؟')){
    persons = [];
    localStorage.removeItem('foodCalcExpense');
    $('notesInput').value = '';
    startDateObj = null; endDateObj = null;
    $('startDateText').textContent = 'انتخاب تاریخ';
    $('endDateText').textContent = 'انتخاب تاریخ';
    localStorage.removeItem('foodCalcData5');
    render();
    calculateCosts();
  }
}

function handleNotesInput(){
  saveData();
}

function saveData(){
  const data = {
    totalExpense: getTotalExpense(),
    notes: $('notesInput').value,
    persons
  };
  localStorage.setItem('foodCalcData5', JSON.stringify(data));
}

function loadData(){
  try{
    const saved = JSON.parse(localStorage.getItem('foodCalcData5') || '{}');
    if(saved.totalExpense !== undefined) localStorage.setItem('foodCalcExpense', String(parseMoney(saved.totalExpense)));
    if(saved.notes !== undefined) $('notesInput').value = saved.notes;
    if(Array.isArray(saved.persons)) {
      persons = saved.persons.map(p => {
        if(p.months === undefined || p.totalDays === undefined){
          let calc = calculateMonthsAndDays(p.startDate[0], p.startDate[1], p.startDate[2], p.endDate[0], p.endDate[1], p.endDate[2]);
          p.months = calc.months;
          p.days = calc.days;
          p.totalDays = calc.totalDays;
        }
        return p;
      });
    }
  }catch(e){ persons = []; }
  calculateCosts();
}

function buildCaptureHTML(){
  const totalExpenseStr = fmt(getTotalExpense());
  
  let rawNotes = $('notesInput').value.trim();
  if(rawNotes.endsWith('✅')) {
    rawNotes = rawNotes.replace(/✅$/, '').trim();
  }
  
  const notesText = rawNotes ? rawNotes + ' ✅' : '✅';
  const notes = notesText.replace(/\n/g, '<br>');

  let html = `
    <div class="capture-title">محاسبه اشتراک مصارف</div>
    
    <table class="capture-table">
      <thead>
        <tr style="background:#7040c7; color:#fff;">
          <th>نام شخص</th>
          <th>تاریخ شروع</th>
          <th>تاریخ ختم</th>
          <th style="background:#d63384;">تعداد ماه</th>
          <th style="background:#198754;">تعداد روز</th>
          <th>سهم هر روز (تومان)</th>
          <th>جمع سهم شخص (تومان)</th>
        </tr>
      </thead>
      <tbody>
  `;

  persons.forEach((p, i) => {
    html += `
      <tr>
        <td style="font-weight:1000">${p.name}</td>
        <td style="direction:ltr; text-align:center;">${p.startDate[0]}/${String(p.startDate[1]).padStart(2,'0')}/${String(p.startDate[2]).padStart(2,'0')}</td>
        <td style="direction:ltr; text-align:center;">${p.endDate[0]}/${String(p.endDate[1]).padStart(2,'0')}/${String(p.endDate[2]).padStart(2,'0')}</td>
        <td style="text-align:center;"><span style="display:inline-flex;align-items:center;justify-content:center;min-width:70px;height:42px;padding:0 10px;background:#fce8f3;border:2px solid #d63384;border-radius:21px;color:#b02a6b;font-weight:1000;font-size:15px;">${fmt(p.months)} ماه</span></td>
        <td style="text-align:center;"><span style="display:inline-flex;align-items:center;justify-content:center;min-width:70px;height:42px;padding:0 10px;background:#e8f8f0;border:2px solid #198754;border-radius:21px;color:#146c43;font-weight:1000;font-size:15px;">${fmt(p.days)} روز</span></td>
        <td class="money" style="color:#0b4fb7">${fmt(p.dailyRate)}</td>
        <td class="money" style="color:#d92323; font-weight:1000">${fmt(p.share)}</td>
      </tr>
    `;
  });

  html += `
      </tbody>
    </table>
    
    <div class="capture-total">
      مجموع کل مصارف: ${totalExpenseStr} تومان
    </div>

    <div class="capture-footer">
      <b>توضیحات:</b><br>${notes}
    </div>
  `;

  $('capture').innerHTML = html;
}

function exportImage(){
  if(!persons.length){ alert('ابتدا حداقل یک شخص به لیست اضافه کنید.'); return; }
  buildCaptureHTML();

  html2canvas($('capture'), {scale: 2.5, useCORS: true, backgroundColor: '#fff', logging: false}).then(canvas => {
    const a = document.createElement('a');
    a.download = 'expense-invoice-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png', 1.0);
    a.click();

    const success = $('saveSuccess');
    success.classList.add('show');
    success.setAttribute('aria-hidden', 'false');
    setTimeout(() => {
      success.classList.remove('show');
      success.setAttribute('aria-hidden', 'true');
    }, 1800);
  }).catch(err => {
    console.error(err);
    alert('خطا در ذخیره عکس فاکتور.');
  });
}

loadData();
$('expenseModalInput').addEventListener('input', function(){
  const raw = parseMoney(this.value);
  this.value = raw ? raw.toLocaleString('en-US') : '';
});
</script>
</body>
</html>
